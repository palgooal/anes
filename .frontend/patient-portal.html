<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صفحة المستفيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="dist/dashboard.css">
</head>
<body>
<div class="app" dir="rtl" lang="ar">
<header class="top"><div class="wrap bar">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="var(--role)"/><path d="M11 32V19a9 9 0 0 1 18 0v13z" fill="#fff"/><path d="M15 32V20a5 5 0 0 1 10 0v12z" fill="var(--role)"/><circle cx="20" cy="23" r="2.4" fill="var(--sun)"/></svg>
    <span>خدمة الدعم والمساندة في الرعاية التلطيفية<small id="role-label"></small></span>
  </div>
  <div class="ub"><span class="who" id="who"></span><button class="btn btn-g btn-s" type="button" id="out" hidden>خروج</button></div>
</div></header>
<div class="demo"><div class="wrap">نموذج تجريبي: البيانات والأسماء غير حقيقية، ولا يُحفظ شيء ولا يُرسل، وكل صفحة مستقلة عن غيرها في هذا النموذج.</div></div>

<main class="wrap">
  <section class="login" id="login">
    <div class="grid gap-3 content-start">
      <span class="rolebadge" id="l-badge"></span>
      <h1 id="l-title"></h1>
      <p class="muted" id="l-desc"></p>
      <ul class="small muted m-0 ps-4.5 grid gap-1" id="l-feat"></ul>
    </div>
    <form class="card" id="lform" novalidate></form>
  </section>
  <section id="dash" hidden>
    <div class="hello"><div><h1 id="hi"></h1><p class="muted small" id="hi-sub"></p></div><div id="hi-act"></div></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="pane"></div>
  </section>
</main>

<div class="overlay" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <header><h3 id="m-title"></h3><button class="x" type="button" id="m-x" aria-label="إغلاق">×</button></header>
  <div id="m-body"></div>
</div></div>
<div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
var ROLE='patient';
/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ar(n){return Number(n).toLocaleString('ar-SA');}
var fmtD,fmtH;
try{fmtD=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{weekday:'long',day:'numeric',month:'long'});}catch(e){fmtD={format:function(d){return d.toDateString();}};}
try{fmtH=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long'});}catch(e){fmtH=null;}
function day(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);if(off>0&&d.getDay()===5)d.setDate(d.getDate()+1);return d;}
function dl(d){return fmtD.format(d);}
function hj(d){try{return fmtH?fmtH.format(d):'';}catch(e){return '';}}
function dbox(d){return '<div class="date"><b>'+d.toLocaleDateString('ar-SA-u-ca-gregory-nu-arab',{day:'numeric'})+'</b><span>'+d.toLocaleDateString('ar-SA-u-ca-gregory-nu-arab',{month:'short'})+'</span></div>';}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},3200);}
function setErr(id,m){var e=$(id);if(e)e.textContent=m||'';return !m;}
var mSubmit=null;
function openModal(title,html,onSubmit,submitLabel){
  $('m-title').textContent=title;
  $('m-body').innerHTML=onSubmit?'<form id="mform" novalidate>'+html+'<button class="btn btn-p" type="submit" style="justify-self:start">'+(submitLabel||'حفظ')+'</button></form>':html;
  mSubmit=onSubmit;$('modal').hidden=false;$('m-x').focus();
}
function closeModal(){$('modal').hidden=true;}
$('m-x').addEventListener('click',closeModal);
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closeModal();});
$('m-body').addEventListener('submit',function(e){e.preventDefault();if(mSubmit&&mSubmit(e.target)!==false)closeModal();});
function vals(f,n){return [].map.call(f.querySelectorAll('input[name="'+n+'"]:checked'),function(i){return i.value;});}
function seg(name,arr,cur){return '<div class="seg">'+arr.map(function(v,i){return '<label for="'+name+i+'"><input type="radio" name="'+name+'" id="'+name+i+'" value="'+esc(v)+'"'+(v===cur?' checked':'')+'>'+esc(v)+'</label>';}).join('')+'</div>';}
function checks(name,arr){return '<div class="checks">'+arr.map(function(v,i){return '<label for="'+name+i+'"><input type="checkbox" name="'+name+'" id="'+name+i+'" value="'+esc(v)+'">'+esc(v)+'</label>';}).join('')+'</div>';}
function sel(id,arr,cur){return '<select id="'+id+'">'+arr.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select>';}
var TIMES=['١٠:٠٠ ص','١:٠٠ م','٧:٠٠ م','٨:٣٠ م'];
var NEXT_DAYS=[1,2,3,4,5,6].map(day);
var LIK=['لا تنطبق','قليلاً','أحياناً','غالباً','تماماً'];
var SCALE_NOTE='<p class="note">تنويه: المقاييس الحالية مبدئية للعرض، وستُضاف المقاييس المعتمدة لاحقاً.</p>';

/* ---------- shared content ---------- */
var TYPES=[
 {t:'جلسة معالجة الخوف والقلق',plan:'أربع جلسات أسبوعية: إنصات وتفريغ للمخاوف، ثم تدبر آيات الطمأنينة والرجاء، ثم تعزيز حسن الظن بالله، ثم ختام وقياس بعدي.'},
 {t:'جلسة السكينة والطمأنينة',plan:'ثلاث جلسات: أذكار وتدبر ودعاء، مع ورد يومي يسير بين الجلسات، ثم قياس بعدي.'},
 {t:'جلسة مواجهة الألم',plan:'ثلاث جلسات: معاني الصبر وأجر المريض، والدعاء عند الألم، بالتنسيق مع الفريق المعالج، ثم قياس بعدي.'},
 {t:'جلسة الحياة الطيبة: إعادة متعة الحياة',plan:'أربع جلسات: استكشاف ما يحبه المريض، وتحويل أيامه إلى أعمال باقية، وإشراك الأسرة، ثم قياس بعدي.'},
 {t:'جلسة مواجهة الخبر السيئ',plan:'جلستان متقاربتان: استقبال الخبر والمواساة بالصبر والاسترجاع، ثم متابعة للمريض والأسرة خلال أسبوع.'},
 {t:'جلسة التفكر والتأمل',plan:'ثلاث جلسات: تأمل في آيات الله ونعمه ومعنى الرحلة، مع وقت تأمل يومي قصير.'}
];
function planOf(t){var x=TYPES.filter(function(y){return y.t===t;})[0];return x?x.plan:'';}
var SCALES={
 'المقياس القبلي للاحتياج الروحي':['أجد الطمأنينة حين أذكر الله أو أسمع القرآن.','أرى لما أمرّ به من مرض معنى وحكمة.','يقلقني المستقبل وما بعد هذا المرض.','أشعر بالوحدة في هذه المرحلة.'],
 'مقياس الرفاه الروحي (مهني)':['أشعر بالسلام الداخلي.','أجد معنى لحياتي رغم المرض.','أشعر بالأمل.','علاقتي بالله تمنحني القوة.'],
 'القياس البعدي للاحتياج الروحي':['أجد الطمأنينة حين أذكر الله أو أسمع القرآن.','أرى لما أمرّ به من مرض معنى وحكمة.','يقلقني المستقبل وما بعد هذا المرض.','أشعر بالوحدة في هذه المرحلة.'],
 'نموذج ختام الجلسات':['استفدت من الجلسات.','كان المرشد متفهماً ومنصتاً.','تحسّن حالي مقارنة ببداية الجلسات.','أنصح غيري بهذه الخدمة.']
};

/* ---------- role config ---------- */
var CFG={
 guide:{title:'لوحة المرشد',label:'لوحة المرشد الديني والروحي',color:'var(--spirit)',who:'المرشد الروحي (حساب تجريبي)',
   desc:'لوحة المرشد لإدارة طلبات المستفيدين ومواعيدهم، وتوثيق الجلسات، وإرسال المقاييس، وتفعيل المتابعة عبر واتساب.',
   feat:['الطلبات الواردة من واتساب وتحديد مواعيدها','مرضاي: نتيجة المقياس تظهر لك وحدك، مع ترشيح نوع الجلسة','توثيق كل جلسة على حدة','المقاييس التخصصية والمهنية والبعدية','تفعيل المتابعة وإنهاء الجلسات'],login:'email',email:'guide@demo.sa'},
 fiqh:{title:'لوحة المستشار الفقهي',label:'لوحة المستشار الفقهي',color:'var(--accent)',who:'المستشار الفقهي (حساب تجريبي)',
   desc:'تصلك الأسئلة التي لم يجد البوت جوابها، فتكتب الجواب ويصل إلى المستفيد على واتساب، وتدير جلسات الاستشارة الفقهية.',
   feat:['الأسئلة المحالة من البوت الفقهي','كتابة الجواب وإرساله للمستفيد','إضافة الجواب إلى مرجع البوت بعد اعتماده','جلسات الاستشارة الفقهية وتوثيقها'],login:'email',email:'fiqh@demo.sa'},
 med:{title:'لوحة المستشار الطبي',label:'لوحة المستشار الطبي',color:'var(--coral)',who:'المستشار الطبي (حساب تجريبي)',
   desc:'تصلك إحالات المرشدين حين يحتاج المستفيد رأياً طبياً، فتكتب توصيتك للمرشد، وتنسّق مع الفريق المعالج عند الحاجة.',
   feat:['الإحالات الواردة من المرشدين','كتابة التوصية للمرشد المحيل','التنسيق مع الفريق الطبي المعالج','جلسات الاستشارة الطبية'],login:'email',email:'med@demo.sa'},
 legal:{title:'لوحة المستشار العدلي',label:'لوحة المستشار العدلي (بالشراكة مع مركز واقف)',color:'var(--grape)',who:'المستشار العدلي (حساب تجريبي)',
   desc:'تدير طلبات الوصايا مرحلة بمرحلة: من الجلسة التمهيدية إلى إعداد المسودة ومراجعتها، ثم الإرشاد إلى التوثيق.',
   feat:['طلبات استشارة الوصايا','متابعة كل طلب بمراحله','ملاحظات على كل مرحلة','جلسات الاستشارة العدلية'],login:'email',email:'legal@demo.sa'},
 patient:{title:'صفحة المستفيد',label:'صفحة المستفيد: المريض أو المرافق',color:'var(--spirit)',who:'',
   desc:'صفحتك الخاصة: مواعيدك، ومقاييسك، وخطة متابعتك، واشتراكاتك في زاد المريض، وأسئلتك الفقهية، ورسائلك. ويدخل المرافق برقمه ليتابع المريض.',
   feat:['مواعيدي وروابط الجلسات','المقاييس المطلوبة مني','خطة متابعة جلستي','ختمتي وبرنامج الباقيات الصالحات','أسئلتي الفقهية وردودها'],login:'otp'},
 admin:{title:'لوحة الإدارة',label:'لوحة الإدارة',color:'var(--ink)',who:'مدير النظام (حساب تجريبي)',
   desc:'لوحة الإدارة بكل الصلاحيات: الطلبات الواردة وتوزيعها، والفريق والمستفيدون، والخدمات والمحتوى، والإحصاءات، والرسائل.',
   feat:['إحصاءات الخدمة','توزيع الطلبات الواردة من واتساب','اعتماد حسابات المرشدين والمستشارين','تعديل الخدمات والمحتوى','مراسلة الفريق والمستفيدين'],login:'email',email:'admin@demo.sa'}
};
var C=CFG[ROLE];
document.documentElement.style.setProperty('--role',C.color);
if(ROLE==='admin')document.documentElement.style.setProperty('--role','var(--accent)');

/* ---------- login ---------- */
$('role-label').textContent=C.label;
$('l-badge').textContent=C.label;
$('l-title').textContent='الدخول إلى '+C.title.replace('لوحة ','لوحة ').replace('صفحة ','صفحة ');
$('l-desc').textContent=C.desc;
$('l-feat').innerHTML=C.feat.map(function(f){return '<li>'+esc(f)+'</li>';}).join('');
if(C.login==='otp'){
  $('lform').innerHTML='<fieldset><legend>أدخل بصفتك</legend>'+seg('lk',['المريض','المرافق'],'المريض')+'</fieldset>'+
   '<label for="l-phone">رقم الجوال<input id="l-phone" dir="ltr" inputmode="tel" placeholder="05XXXXXXXX"><span class="err" id="le-phone"></span></label>'+
   '<button class="btn btn-g" type="button" id="l-send" style="justify-self:start">أرسل رمز التحقق</button>'+
   '<label for="l-otp" id="l-otp-w" hidden>رمز التحقق<input id="l-otp" dir="ltr" inputmode="numeric" maxlength="4" placeholder="••••"><span class="small muted">في النموذج: أي أربعة أرقام.</span><span class="err" id="le-otp"></span></label>'+
   '<button class="btn btn-p" type="submit">دخول</button>'+
   '<button class="btn btn-g" type="button" id="l-demo" style="justify-self:start">دخول تجريبي مباشر</button>'+
   '<p class="info">لا يحتاج المستفيد إلى كلمة مرور: يدخل برقم جواله المسجّل لدى الخدمة ورمز يصله على واتساب.</p>';
  $('l-send').addEventListener('click',function(){var p=$('l-phone').value.replace(/\D/g,'');if(!setErr('le-phone',/^05\d{8}$/.test(p)?'':'اكتب رقم جوال من ١٠ أرقام يبدأ بـ 05'))return;$('l-otp-w').hidden=false;toast('أُرسل رمز التحقق إلى واتساب (تجريبي)');});
}else{
  $('lform').innerHTML='<label for="l-email">البريد الإلكتروني<input id="l-email" type="email" dir="ltr" autocomplete="username" value="'+C.email+'"></label>'+
   '<label for="l-pass">كلمة المرور<input id="l-pass" type="password" dir="ltr" autocomplete="current-password" value="demo1234"></label>'+
   '<span class="err" id="le-pass"></span>'+
   '<button class="btn btn-p" type="submit">دخول</button>'+
   '<p class="info">في النظام الفعلي: تحقق ثنائي برمز على الجوال، ولا يُفعّل الحساب إلا بعد اعتماد الإدارة.</p>';
}
function enter(){
  $('login').hidden=true;$('dash').hidden=false;$('out').hidden=false;
  $('who').textContent=ROLE==='patient'?(ME.kind==='المرافق'?'مرافق: '+ME.cname:ME.name):C.who;
  buildTabs();window.scrollTo(0,0);
}
$('lform').addEventListener('submit',function(e){
  e.preventDefault();
  if(C.login==='otp'){var p=$('l-phone').value.replace(/\D/g,''),o=$('l-otp').value.replace(/\D/g,'');
    if(!setErr('le-phone',/^05\d{8}$/.test(p)?'':'اكتب رقم جوال من ١٠ أرقام يبدأ بـ 05'))return;
    if($('l-otp-w').hidden){$('l-send').click();return;}
    if(!setErr('le-otp',o.length===4?'':'اكتب الرمز المكوّن من ٤ أرقام'))return;
    ME.kind=vals(this,'lk')[0];}
  else{if(!setErr('le-pass',$('l-pass').value.length>=6?'':'اكتب كلمة المرور'))return;}
  enter();
});
if($('l-demo'))$('l-demo').addEventListener('click',function(){ME.kind=vals($('lform'),'lk')[0]||'المريض';enter();});
$('out').addEventListener('click',function(){$('dash').hidden=true;$('login').hidden=false;$('out').hidden=true;$('who').textContent='';});

/* ---------- tabs ---------- */
var TABS=[],CUR=null;
function buildTabs(){
  TABS=MODULES[ROLE]();
  $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t.k+'">'+t.l+'<span class="nb" id="nb-'+t.k+'"></span></button>';}).join('');
  show(TABS[0].k);
}
function show(k){CUR=k;document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===k);});render();}
function render(){var t=TABS.filter(function(x){return x.k===CUR;})[0];$('pane').innerHTML=t.r();if(HELLO[ROLE])HELLO[ROLE]();badges();}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)show(b.getAttribute('data-tab'));});
var ACT={};
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var f=ACT[b.getAttribute('data-a')];if(f){e.preventDefault();f(b);}});
document.addEventListener('change',function(e){var b=e.target.closest('[data-ch]');if(!b)return;var f=ACT[b.getAttribute('data-ch')];if(f)f(b);});
function badge(k,n){var e=$('nb-'+k);if(e)e.textContent=n?ar(n):'';}
var HELLO={},BADGES={};
function badges(){if(BADGES[ROLE])BADGES[ROLE]();}
function kpis(arr){return '<div class="kpis">'+arr.map(function(k){return '<div class="kpi" style="--k:'+(k[2]||'var(--role)')+'"><b>'+(typeof k[1]==='number'?ar(k[1]):k[1])+'</b><span>'+k[0]+'</span></div>';}).join('')+'</div>';}
function msgsList(arr){return arr.length?'<div class="list">'+arr.map(function(m,i){return '<div class="item" style="--c:'+(m.read?'var(--line)':'var(--coral)')+'"><div style="grid-column:1/-1;display:grid;gap:4px"><div class="sec-h"><h4>'+esc(m.sub)+'</h4>'+(m.read?'':'<span class="pill new">جديدة</span>')+'</div><p>من '+esc(m.from)+' · '+esc(m.when)+'</p></div><div class="acts"><button class="btn btn-g btn-s" type="button" data-a="readmsg" data-i="'+i+'">اقرأ</button></div></div>';}).join('')+'</div>':'<p class="empty">لا رسائل.</p>';}
ACT.readmsg=function(b){var m=MSGS[+b.getAttribute('data-i')];m.read=true;openModal(m.sub,'<p class="small muted">من '+esc(m.from)+' · '+esc(m.when)+'</p>'+m.body.split('\n').map(function(p){return '<p>'+esc(p)+'</p>';}).join(''));render();};
function profilePane(extra){
  return '<div class="two"><form class="card" id="pf" novalidate style="display:grid;gap:12px"><h3>بياناتي</h3>'+
   '<label for="pf-n">الاسم الظاهر<input id="pf-n" value="'+esc(C.who.replace(' (حساب تجريبي)',''))+'"></label>'+
   '<div class="row"><label for="pf-p">الجوال<input id="pf-p" dir="ltr" value="05XXXXXXXX"></label><label for="pf-e">البريد<input id="pf-e" dir="ltr" value="'+(C.email||'')+'"></label></div>'+(extra||'')+
   '<button class="btn btn-p" type="button" data-a="saveprof" style="justify-self:start">احفظ</button></form>'+
   '<form class="card" novalidate style="display:grid;gap:12px;align-content:start"><h3>تغيير كلمة المرور</h3>'+
   '<label for="pw1">كلمة المرور الحالية<input id="pw1" type="password" dir="ltr" autocomplete="current-password"></label>'+
   '<label for="pw2">كلمة المرور الجديدة<input id="pw2" type="password" dir="ltr" autocomplete="new-password"><span class="err" id="pwe"></span></label>'+
   '<button class="btn btn-p" type="button" data-a="savepw" style="justify-self:start">غيّر كلمة المرور</button></form></div>';
}
ACT.saveprof=function(){toast('حُفظت بياناتك');};
ACT.savepw=function(){var v=$('pw2').value;if(!setErr('pwe',v.length>=8&&/\d/.test(v)&&/\D/.test(v)?'':'٨ أحرف على الأقل، فيها حروف وأرقام'))return;$('pw1').value='';$('pw2').value='';toast('غُيّرت كلمة المرور');};

/* ======================================================
   DATA
   ====================================================== */

function pById(id){return PATS.filter(function(p){return p.id===+id;})[0];}
function apptItem(p){var d=day(p.next.d);return '<div class="item">'+dbox(d)+'<div><h4>'+esc(p.name)+' <span class="pill">'+p.kind+'</span></h4><p>'+dl(d)+' · '+'<bdi>'+p.next.t+'</bdi>'+' · '+(p.intake.type?esc(p.intake.type):'بانتظار اعتمادك لنوع الجلسة')+'</p></div><div class="acts"><button class="btn btn-g btn-s" type="button" data-a="start">ابدأ الجلسة</button><button class="btn btn-p btn-s" type="button" data-a="doc" data-p="'+p.id+'">وثّق الجلسة</button></div></div>';}
function patCard(p){
  var it=p.intake,h='<div class="card" style="display:grid;gap:10px;border-top:4px solid '+(p.closed?'var(--line)':'var(--role)')+'"><div class="sec-h"><h3 style="font-size:1rem">'+esc(p.name)+'</h3>'+(p.closed?'<span class="pill cx" style="text-decoration:none">أُنهيت الجلسات</span>':'<span class="pill role">نشط</span>')+'</div>'+
   '<p class="small muted">'+p.kind+' · '+(typeof p.age==='number'?ar(p.age)+' سنة · ':'')+esc(p.hosp)+(p.comp?' · المرافق: '+esc(p.comp):'')+'</p><div class="box">';
  if(it.path==='scale'){h+='<div><b>المقياس القبلي: '+esc(it.lvl)+' ('+ar(it.pct)+'٪)</b> <span class="small muted">· يظهر لك وحدك</span></div><div>ترشيح النظام: <b>'+esc(it.sug)+'</b> أو '+esc(it.alt)+'</div>';}
  else{h+='<div>اختار المستفيد: <b>'+esc(it.type)+'</b></div><div class="small">المقياس القبلي: '+(it.pct!=null?esc(it.lvl):'لم يُجرَ بعد')+'</div>';}
  if(!it.type)h+='<label for="ty'+p.id+'" class="small">اختر الأنسب للمستفيد'+sel('ty'+p.id,TYPES.map(function(t){return t.t;}),it.sug)+'</label><p class="small muted">الخطة المقترحة: '+esc(planOf(it.sug))+'</p><button class="btn btn-p btn-s" type="button" data-a="settype" data-p="'+p.id+'" style="justify-self:start">اعتماد نوع الجلسة</button>';
  else if(it.path==='scale')h+='<div>نوع الجلسة المعتمد: <b>'+esc(it.type)+'</b></div>';
  h+='</div>';
  h+='<div class="tags">'+(p.follow?'<span class="pill ok">المتابعة مفعّلة عبر '+esc(p.follow.ch)+'</span>':'')+p.scales.map(function(s){return s.st==='wait'?'<span class="pill wait">'+esc(s.n)+': بانتظار المستفيد</span>':'<span class="pill">'+esc(s.n)+': '+esc(s.res||'تم')+'</span>';}).join('')+'<span class="pill">الجلسات: '+ar(p.sessions.length)+'</span></div>';
  if(!p.closed)h+='<div class="acts"><button class="btn btn-g btn-s" type="button" data-a="sendscale" data-p="'+p.id+'">إرسال مقياس</button><button class="btn btn-g btn-s" type="button" data-a="follow" data-p="'+p.id+'"'+(it.type?'':' disabled')+'>'+(p.follow?'تعديل المتابعة':'تفعيل المتابعة')+'</button><button class="btn btn-g btn-s" type="button" data-a="refer" data-p="'+p.id+'">إحالة</button><button class="btn btn-g btn-s" type="button" data-a="hist" data-p="'+p.id+'">سجل الجلسات</button><button class="btn btn-g btn-s" type="button" data-a="end" data-p="'+p.id+'">إنهاء الجلسات</button></div>';
  else h+='<p class="small">الملخص الختامي: '+esc(p.summary||'')+'</p><div class="acts"><button class="btn btn-g btn-s" type="button" data-a="hist" data-p="'+p.id+'">سجل الجلسات</button></div>';
  return h+'</div>';
}
